<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>樂善堂楊葛小琳中學開放日 2026 - 攤位動態 QR Code 顯示器</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
          colors: {
            'neo-bg': '#FFFDF5',
            'neo-black': '#000000',
            'neo-red': '#FF6B6B',
            'neo-yellow': '#FFD93D',
            'neo-violet': '#C4B5FD',
          },
          boxShadow: {
            'neo-sm': '4px 4px 0px 0px #000000',
            'neo-md': '6px 6px 0px 0px #000000',
            'neo-lg': '8px 8px 0px 0px #000000',
            'neo-xl': '12px 12px 0px 0px #000000',
            'neo-2xl': '16px 16px 0px 0px #000000',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FFFDF5;
      background-image: radial-gradient(#000000 2px, transparent 2.5px);
      background-size: 30px 30px;
    }
    
    /* 防偷看遮罩條紋背景 */
    .mask-pattern {
      background-color: #000000;
      background-image: repeating-linear-gradient(45deg, #FFD93D 0, #FFD93D 15px, #000000 0, #000000 30px);
    }
  </style>
</head>
<body class="text-neo-black font-sans min-h-screen flex flex-col justify-between p-6 select-none selection:bg-neo-yellow">

  <header class="flex justify-between items-center max-w-4xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <span class="font-black text-sm uppercase bg-neo-black text-white px-3 py-1.5 border-2 border-neo-black shadow-neo-sm">選擇攤位</span>
      <select id="booth-select" onchange="changeBooth()" class="font-black text-lg bg-neo-yellow border-4 border-neo-black p-2 shadow-neo-sm focus:outline-none cursor-pointer max-w-md truncate">
      </select>
    </div>

    <div class="flex items-center gap-3">
      <div class="bg-white border-4 border-neo-black px-4 py-2 shadow-neo-sm font-black text-sm flex items-center gap-2">
        <span class="w-3 h-3 bg-emerald-500 rounded-full border-2 border-neo-black animate-ping"></span>
        QR 碼更新：<span id="refresh-timer" class="font-mono text-neo-red text-base">03:00</span>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto w-full my-auto py-8">
    <div class="bg-white border-8 border-neo-black p-8 shadow-neo-2xl text-center space-y-6 relative -rotate-1">
      
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-neo-red border-4 border-neo-black px-6 py-1.5 font-black text-lg text-white uppercase tracking-widest rotate-2 shadow-neo-md">
        請用手機掃描蓋印
      </div>

      <div class="pt-4 space-y-1">
        <h1 id="booth-title" class="text-3xl font-black uppercase tracking-tight">載入中...</h1>
        <p class="text-sm font-bold text-slate-600">請掃描下方動態 QR Code 領取印章</p>
      </div>

      <!-- QR Code 容器與安全遮罩 -->
      <div class="flex justify-center my-6">
        <div class="p-4 bg-neo-yellow border-8 border-neo-black shadow-neo-lg inline-block relative overflow-hidden">
          
          <!-- 二維碼 -->
          <div id="qrcode" class="bg-white p-4 border-4 border-neo-black"></div>

          <!-- 防偷拍覆蓋遮罩 (點擊或按住揭開) -->
          <div id="qr-mask" onclick="revealCodeTemporarily()" class="absolute inset-0 mask-pattern flex flex-col items-center justify-center p-4 cursor-pointer transition-opacity duration-200 z-20">
            <div class="bg-white border-4 border-neo-black p-4 shadow-neo-md text-center rotate-1 hover:scale-105 transition-transform">
              <span class="text-3xl">🔒</span>
              <div class="font-black text-lg uppercase mt-1">點擊螢幕顯示蓋印碼</div>
              <div class="text-xs font-bold text-slate-600 mt-0.5">防遠端偷掃保護中</div>
            </div>
          </div>

        </div>
      </div>

      <div class="bg-neo-bg border-4 border-neo-black p-4 text-xs font-bold space-y-1 text-slate-700">
        <p>⚡ 本 QR Code 與印章動態碼每 3 分鐘自動更新，防範截圖轉傳</p>
        <p>⚡ 點擊遮罩後將公開 5 秒，隨後自動恢復鎖定保護</p>
      </div>

    </div>
  </main>

  <footer class="max-w-4xl mx-auto w-full flex justify-between items-end">
    <!-- 印章動態碼區域 (亦受遮罩保護) -->
    <div class="bg-neo-violet border-4 border-neo-black p-4 shadow-neo-lg rotate-2 max-w-xs relative overflow-hidden">
      <div class="font-black text-xs uppercase tracking-wider text-slate-800">相機無法開啟？印章動態碼：</div>
      
      <div class="relative my-1">
        <div id="rescue-code" class="text-4xl font-black font-mono tracking-widest text-neo-black bg-white border-2 border-neo-black px-3 py-1 text-center">
          ----
        </div>
        <!-- 動態碼獨立小型遮罩 -->
        <div id="pin-mask" onclick="revealCodeTemporarily()" class="absolute inset-0 bg-neo-black text-neo-yellow border-2 border-neo-black font-black text-sm flex items-center justify-center cursor-pointer">
          🔒 點擊解鎖動態碼
        </div>
      </div>

      <div class="text-[10px] font-black text-slate-600">訪客可在手機「印章動態碼」輸入上方 4 位數字</div>
    </div>

    <div class="bg-white border-4 border-neo-black px-5 py-3 shadow-neo-md text-right font-black">
      <div class="text-xs text-slate-500 uppercase tracking-wider">系統目前時間</div>
      <div id="clock-display" class="text-2xl font-mono">14:30:00</div>
    </div>
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzA4Iuflm5N6faXsrUXPQ8Q68VNfcDysS_3ru281wLymPPxzt92fliq2k7Of0pIdCBcHw/exec";
    let currentBooth = "B01";
    let qrcodeInstance = null;
    let countdownSeconds = 180;
    let boothMap = {};
    let totalBooths = 19;
    let revealTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initBoothSelect();
      fetchBackendData();
      updateQRCode();
      startTimers();
    });

    // 點擊解鎖防偷掃遮罩 5 秒
    function revealCodeTemporarily() {
      const qrMask = document.getElementById('qr-mask');
      const pinMask = document.getElementById('pin-mask');

      qrMask.classList.add('opacity-0', 'pointer-events-none');
      pinMask.classList.add('opacity-0', 'pointer-events-none');

      if (revealTimer) clearTimeout(revealTimer);

      // 5 秒後自動恢復遮蔽保護
      revealTimer = setTimeout(() => {
        qrMask.classList.remove('opacity-0', 'pointer-events-none');
        pinMask.classList.remove('opacity-0', 'pointer-events-none');
      }, 5000);
    }

    function initBoothSelect() {
      const select = document.getElementById('booth-select');
      const savedValue = select.value || currentBooth;
      select.innerHTML = '';
      
      for (let i = 1; i <= totalBooths; i++) {
        const id = 'B' + i.toString().padStart(2, '0');
        const name = boothMap[id] ? ` (${boothMap[id]})` : '';
        const option = document.createElement('option');
        option.value = id;
        option.innerText = `${id}${name}`;
        select.appendChild(option);
      }
      
      select.value = savedValue;
      updateBoothTitle();
    }

    function fetchBackendData() {
      if (!GAS_API_URL || GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(data => {
          let updated = false;
          if (data && data.config && data.config.totalBooths) {
            if (totalBooths !== data.config.totalBooths) {
              totalBooths = data.config.totalBooths;
              updated = true;
            }
          }
          if (data && data.booths) {
            boothMap = data.booths;
            updated = true;
          }
          if (updated) {
            initBoothSelect();
          }
        }).catch(err => console.warn("Fetch backend error:", err));
    }

    function updateBoothTitle() {
      const name = boothMap[currentBooth] || '';
      const titleElem = document.getElementById('booth-title');
      if (name) {
        titleElem.innerText = `${currentBooth} ${name}`;
      } else {
        titleElem.innerText = `攤位 ${currentBooth}`;
      }
    }

    function changeBooth() {
      currentBooth = document.getElementById('booth-select').value;
      updateBoothTitle();
      countdownSeconds = 180;
      updateQRCode();
    }

    function generateDynamicPin(boothNum, timeBlock) {
      const SALT = 20261013;
      let hash = (boothNum * 9301 + timeBlock * 49297 + SALT) % 233280;
      hash = (hash * 9301 + 49297) % 233280;
      return 1000 + (Math.abs(hash) % 9000);
    }

    function updateQRCode() {
      const timeBlock = Math.floor(Date.now() / (1000 * 180));
      const payload = 'booth:' + currentBooth + ':t:' + timeBlock;

      const boothNum = parseInt(currentBooth.replace("B", ""));
      const dynamicRescueCode = generateDynamicPin(boothNum, timeBlock);
      document.getElementById('rescue-code').innerText = dynamicRescueCode;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      qrcodeInstance = new QRCode(qrContainer, {
        text: payload,
        width: 240,
        height: 240,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function startTimers() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0];

        countdownSeconds--;
        if (countdownSeconds <= 0) {
          countdownSeconds = 180;
          updateQRCode();
        }

        const mins = Math.floor(countdownSeconds / 60).toString().padStart(2, '0');
        const secs = (countdownSeconds % 60).toString().padStart(2, '0');
        document.getElementById('refresh-timer').innerText = mins + ':' + secs;
      }, 1000);
    }
  </script>
</body>
</html>
